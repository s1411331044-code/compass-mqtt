
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手機簡易地震儀</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f4f8;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    h2 { color: #243447; }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin: 14px auto;
      max-width: 700px;
      box-shadow: 0 2px 8px #0001;
    }
    .values {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .value {
      background: #edf3fa;
      padding: 14px 5px;
      border-radius: 8px;
    }
    .number {
      font-size: 25px;
      font-weight: bold;
      margin-top: 6px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      margin: 5px;
      font-size: 16px;
      color: white;
      background: #2878d0;
    }
    button.stop { background: #d9534f; }
    button.reset { background: #666; }
    canvas { max-width: 100%; }
    #mqttStatus, #sensorStatus { color: #555; }
    .hint { color: #666; font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
  <h2>手機簡易地震儀</h2>

  <div class="panel">
    <p id="mqttStatus">MQTT 連線中...</p>
    <p id="sensorStatus">感測器尚未啟動</p>
    <button onclick="startSensor()">開始監測</button>
    <button class="stop" onclick="stopSensor()">停止監測</button>
    <button class="reset" onclick="resetPeak()">最大值歸零</button>
  </div>

  <div class="panel">
    <h3>即時三軸加速度（m/s²）</h3>
    <div class="values">
      <div class="value">X 軸<div class="number" id="xValue">0.00</div></div>
      <div class="value">Y 軸<div class="number" id="yValue">0.00</div></div>
      <div class="value">Z 軸<div class="number" id="zValue">0.00</div></div>
      <div class="value">合成震動<div class="number" id="totalValue">0.00</div></div>
    </div>
  </div>

  <div class="panel">
    <h3>即時地震波形</h3>
    <canvas id="earthquakeChart"></canvas>
    <p class="hint">顯示最近 100 筆資料，三軸加速度單位為 m/s²。</p>
  </div>

  <div class="panel">
    <h3>震動統計</h3>
    <p>目前震動強度</p>
    <div class="number" id="currentLevel">0.00 m/s²</div>
    <p>本次最大震動值</p>
    <div class="number" id="peakValue">0.00 m/s²</div>
    <p>資料傳送次數：<span id="sentCount">0</span></p>
    <p class="hint">震動強度是手機量測值，不代表地震規模或震度。</p>
  </div>

<script>
  // MQTT 設定
  const broker = "wss://broker.hivemq.com:8884/mqtt";
  const topic = "nutc/im/s1411331044/earthquake/data";

  const deviceId = localStorage.getItem("earthquakeDeviceId") ||
    ("phone-" + Math.random().toString(36).slice(2, 10));

  localStorage.setItem("earthquakeDeviceId", deviceId);

  let client = null;
  let sensorRunning = false;
  let publishTimer = null;
  let sentCount = 0;
  let peak = 0;

  let latestData = {
    x: 0, y: 0, z: 0, total: 0
  };

  // 備用重力估算的低通基準
  let gravityX = 0;
  let gravityY = 0;
  let gravityZ = 0;
  let gravityInitialized = false;

  // MQTT 連線
  client = mqtt.connect(broker, {
    clientId: "eq_mobile_" + Math.random().toString(16).slice(2, 10),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
  });

  client.on("connect", () => {
    document.getElementById("mqttStatus").textContent =
      "MQTT 已連線";
  });

  client.on("reconnect", () => {
    document.getElementById("mqttStatus").textContent =
      "MQTT 重新連線中...";
  });

  client.on("error", (err) => {
    console.error(err);
    document.getElementById("mqttStatus").textContent =
      "MQTT 連線錯誤";
  });

  // 建立波形圖
  const chart = new Chart(
    document.getElementById("earthquakeChart"),
    {
      type: "line",
      data: {
        labels: [],
        datasets: [
          {
            label: "X 軸",
            data: [],
            borderColor: "red",
            borderWidth: 2,
            pointRadius: 0
          },
          {
            label: "Y 軸",
            data: [],
            borderColor: "green",
            borderWidth: 2,
            pointRadius: 0
          },
          {
            label: "Z 軸",
            data: [],
            borderColor: "blue",
            borderWidth: 2,
            pointRadius: 0
          }
        ]
      },
      options: {
        responsive: true,
        animation: false,
        interaction: { intersect: false, mode: "index" },
        scales: {
          x: { display: false },
          y: {
            title: {
              display: true,
              text: "加速度（m/s²）"
            }
          }
        }
      }
    }
  );

  function updateChart(x, y, z) {
    chart.data.labels.push(new Date().toLocaleTimeString());

    chart.data.datasets[0].data.push(x);
    chart.data.datasets[1].data.push(y);
    chart.data.datasets[2].data.push(z);

    if (chart.data.labels.length > 100) {
      chart.data.labels.shift();
      chart.data.datasets.forEach(ds => ds.data.shift());
    }

    chart.update("none");
  }

  // 感測器事件
  function handleMotion(event) {
    let x, y, z;

    // 優先使用已扣除重力的加速度
    if (event.acceleration &&
        event.acceleration.x !== null &&
        event.acceleration.y !== null &&
        event.acceleration.z !== null) {

      x = event.acceleration.x;
      y = event.acceleration.y;
      z = event.acceleration.z;

    } else if (event.accelerationIncludingGravity) {
      // 備用：使用低通濾波估計重力，再扣除重力
      const a = event.accelerationIncludingGravity;

      const rx = a.x ?? 0;
      const ry = a.y ?? 0;
      const rz = a.z ?? 0;

      if (!gravityInitialized) {
        gravityX = rx;
        gravityY = ry;
        gravityZ = rz;
        gravityInitialized = true;
      } else {
        const alpha = 0.08;
        gravityX += alpha * (rx - gravityX);
        gravityY += alpha * (ry - gravityY);
        gravityZ += alpha * (rz - gravityZ);
      }

      x = rx - gravityX;
      y = ry - gravityY;
      z = rz - gravityZ;

    } else {
      return;
    }

    const total = Math.sqrt(x*x + y*y + z*z);

    latestData = { x, y, z, total };

    document.getElementById("xValue").textContent = x.toFixed(2);
    document.getElementById("yValue").textContent = y.toFixed(2);
    document.getElementById("zValue").textContent = z.toFixed(2);
    document.getElementById("totalValue").textContent = total.toFixed(2);
    document.getElementById("currentLevel").textContent =
      total.toFixed(2) + " m/s²";

    if (total > peak) {
      peak = total;
      document.getElementById("peakValue").textContent =
        peak.toFixed(2) + " m/s²";
    }

    updateChart(x, y, z);
  }

  // 開始監測
  async function startSensor() {
    if (sensorRunning) return;

    try {
      if (
        typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function"
      ) {
        const permission =
          await DeviceMotionEvent.requestPermission();

        if (permission !== "granted") {
          alert("未取得動作感測器權限");
          return;
        }
      }

      if (typeof DeviceMotionEvent === "undefined") {
        alert("此瀏覽器不支援動作感測器");
        return;
      }

      window.addEventListener("devicemotion", handleMotion);
      sensorRunning = true;

      document.getElementById("sensorStatus").textContent =
        "地震儀監測中";

      // 每 100ms 傳送一次資料
      publishTimer = setInterval(() => {
        if (client && client.connected) {
          const data = {
            ...latestData,
            deviceId,
            timestamp: Date.now()
          };

          client.publish(topic, JSON.stringify(data));
          sentCount++;

          document.getElementById("sentCount").textContent =
            sentCount;
        }
      }, 100);

    } catch (error) {
      console.error(error);
      alert("感測器啟動失敗：" + error.message);
    }
  }

  // 停止監測
  function stopSensor() {
    if (!sensorRunning) return;

    window.removeEventListener("devicemotion", handleMotion);
    clearInterval(publishTimer);

    sensorRunning = false;

    document.getElementById("sensorStatus").textContent =
      "監測已停止";
  }

  // 最大震動值歸零
  function resetPeak() {
    peak = 0;
    document.getElementById("peakValue").textContent =
      "0.00 m/s²";
  }
</script>
</body>
</html>
