
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手機簡易地震儀 MQTT</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f4f8;
      margin: 0;
      padding: 16px;
      text-align: center;
    }

    h2 { color: #243447; }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin: 14px auto;
      max-width: 700px;
      box-shadow: 0 2px 8px #0001;
    }

    .values {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .value {
      background: #edf3fa;
      padding: 14px 5px;
      border-radius: 8px;
    }

    .number {
      font-size: 25px;
      font-weight: bold;
      margin-top: 6px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 5px;
      font-size: 16px;
      color: white;
      background: #2878d0;
      cursor: pointer;
    }

    button.stop { background: #d9534f; }
    button.reset { background: #666; }
    button.alarmBtn { background: #e67e22; }

    canvas { max-width: 100%; }

    .alarm {
      display: none;
      background: #ffe1e1;
      color: #c00000;
      border: 2px solid red;
      border-radius: 10px;
      padding: 18px;
      font-size: 24px;
      font-weight: bold;
      margin: 12px 0;
    }

    .normal {
      color: green;
      font-weight: bold;
    }

    .hint {
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h2>手機簡易地震儀</h2>

  <div class="panel">
    <h3>系統狀態</h3>
    <p id="mqttStatus">MQTT 連線中...</p>
    <p id="sensorStatus">感測器尚未啟動</p>

    <button onclick="startSensor()">開始監測</button>
    <button class="stop" onclick="stopSensor()">停止監測</button>
    <button class="reset" onclick="resetPeak()">最大值歸零</button>
    <button class="alarmBtn" onclick="enableAlarm()">啟用警報聲</button>
  </div>

  <div class="panel">
    <h3>警報狀態</h3>

    <div id="alarmBox" class="alarm">
      ⚠ 震動警報！超過 0.8 m/s²
    </div>

    <p id="alarmStatus" class="normal">目前正常</p>
    <p>警報門檻：0.8 m/s²</p>
  </div>

  <div class="panel">
    <h3>即時三軸加速度（m/s²）</h3>

    <div class="values">
      <div class="value">
        X 軸
        <div class="number" id="xValue">0.00</div>
      </div>

      <div class="value">
        Y 軸
        <div class="number" id="yValue">0.00</div>
      </div>

      <div class="value">
        Z 軸
        <div class="number" id="zValue">0.00</div>
      </div>

      <div class="value">
        合成震動
        <div class="number" id="totalValue">0.00</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h3>即時地震波形</h3>
    <canvas id="earthquakeChart"></canvas>
    <p class="hint">顯示最近 100 筆三軸加速度資料。</p>
  </div>

  <div class="panel">
    <h3>震動統計</h3>

    <p>目前震動強度</p>
    <div class="number" id="currentLevel">0.00 m/s²</div>

    <p>本次最大震動值</p>
    <div class="number" id="peakValue">0.00 m/s²</div>

    <p>資料傳送次數：<span id="sentCount">0</span></p>
    <p class="hint">
      震動值是手機感測器量測結果，不代表地震規模或官方震度。
    </p>
  </div>

<script>
  // =========================
  // 1. MQTT 設定
  // =========================

  const broker = "wss://broker.hivemq.com:8884/mqtt";

  const topic =
    "nutc/im/s1411331044/earthquake/data";

  const ALARM_THRESHOLD = 0.8;

  const deviceId =
    localStorage.getItem("earthquakeDeviceId") ||
    ("phone-" + Math.random().toString(36).slice(2, 10));

  localStorage.setItem("earthquakeDeviceId", deviceId);

  let client = null;
  let sensorRunning = false;
  let publishTimer = null;

  let sentCount = 0;
  let peak = 0;

  let latestData = {
    x: 0,
    y: 0,
    z: 0,
    total: 0
  };

  // =========================
  // 2. 警報聲設定
  // =========================

  let audioContext = null;
  let alarmTimer = null;
  let alarmEnabled = false;
  let alarmActive = false;

  async function enableAlarm() {
    try {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        alert("此瀏覽器不支援警報聲功能");
        return;
      }

      if (!audioContext) {
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      alarmEnabled = true;

      document.getElementById("alarmStatus").textContent =
        alarmActive
          ? "警報中！"
          : "警報聲已啟用，目前正常";

      alert("警報聲已啟用");

      if (alarmActive) {
        startAlarmSound();
      }

    } catch (error) {
      console.error(error);
      alert("無法啟用警報聲，請確認瀏覽器設定");
    }
  }

  function beep() {
    if (!audioContext || !alarmEnabled) return;

    if (audioContext.state !== "running") return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 880;

    gain.gain.setValueAtTime(
      0.25,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.3
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.3);
  }

  function startAlarmSound() {
    if (!alarmEnabled || alarmTimer !== null) return;

    beep();

    alarmTimer = setInterval(() => {
      beep();
    }, 600);
  }

  function stopAlarmSound() {
    if (alarmTimer !== null) {
      clearInterval(alarmTimer);
      alarmTimer = null;
    }
  }

  function checkAlarm(total) {
    const alarmBox =
      document.getElementById("alarmBox");

    const alarmStatus =
      document.getElementById("alarmStatus");

    if (total > ALARM_THRESHOLD) {
      alarmActive = true;

      alarmBox.style.display = "block";

      alarmStatus.textContent =
        "⚠ 警報中！震動超過門檻";

      alarmStatus.style.color = "red";

      startAlarmSound();

    } else {
      alarmActive = false;

      alarmBox.style.display = "none";

      alarmStatus.textContent =
        "目前正常";

      alarmStatus.style.color = "green";

      stopAlarmSound();
    }
  }

  // =========================
  // 3. MQTT 連線
  // =========================

  client = mqtt.connect(broker, {
    clientId:
      "eq_mobile_" + Math.random().toString(16).slice(2, 10),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
  });

  client.on("connect", () => {
    document.getElementById("mqttStatus").textContent =
      "MQTT 已連線";
  });

  client.on("reconnect", () => {
    document.getElementById("mqttStatus").textContent =
      "MQTT 重新連線中...";
  });

  client.on("offline", () => {
    document.getElementById("mqttStatus").textContent =
      "MQTT 離線";
  });

  client.on("error", (error) => {
    console.error("MQTT 錯誤：", error);

    document.getElementById("mqttStatus").textContent =
      "MQTT 連線錯誤";
  });

  // =========================
  // 4. 地震波形圖
  // =========================

  const chart = new Chart(
    document.getElementById("earthquakeChart"),
    {
      type: "line",

      data: {
        labels: [],

        datasets: [
          {
            label: "X 軸",
            data: [],
            borderColor: "red",
            borderWidth: 2,
            pointRadius: 0
          },
          {
            label: "Y 軸",
            data: [],
            borderColor: "green",
            borderWidth: 2,
            pointRadius: 0
          },
          {
            label: "Z 軸",
            data: [],
            borderColor: "blue",
            borderWidth: 2,
            pointRadius: 0
          }
        ]
      },

      options: {
        responsive: true,
        animation: false,

        scales: {
          x: {
            display: false
          },

          y: {
            title: {
              display: true,
              text: "加速度（m/s²）"
            }
          }
        }
      }
    }
  );

  function updateChart(x, y, z) {
    chart.data.labels.push(
      new Date().toLocaleTimeString()
    );

    chart.data.datasets[0].data.push(x);
    chart.data.datasets[1].data.push(y);
    chart.data.datasets[2].data.push(z);

    if (chart.data.labels.length > 100) {
      chart.data.labels.shift();

      chart.data.datasets.forEach(dataset => {
        dataset.data.shift();
      });
    }

    chart.update("none");
  }

  // =========================
  // 5. 重力估算
  // =========================

  let gravityX = 0;
  let gravityY = 0;
  let gravityZ = 0;
  let gravityInitialized = false;

  function handleMotion(event) {
    let x, y, z;

    // 優先使用已扣除重力的加速度
    const a = event.acceleration;

    if (
      a &&
      a.x !== null &&
      a.y !== null &&
      a.z !== null
    ) {
      x = a.x;
      y = a.y;
      z = a.z;

    } else if (event.accelerationIncludingGravity) {

      // 備用：以低通濾波估計重力
      const raw = event.accelerationIncludingGravity;

      const rx = raw.x ?? 0;
      const ry = raw.y ?? 0;
      const rz = raw.z ?? 0;

      if (!gravityInitialized) {
        gravityX = rx;
        gravityY = ry;
        gravityZ = rz;
        gravityInitialized = true;
      } else {
        const alpha = 0.08;

        gravityX += alpha * (rx - gravityX);
        gravityY += alpha * (ry - gravityY);
        gravityZ += alpha * (rz - gravityZ);
      }

      x = rx - gravityX;
      y = ry - gravityY;
      z = rz - gravityZ;

    } else {
      return;
    }

    const total = Math.sqrt(
      x*x + y*y + z*z
    );

    latestData = {
      x: x,
      y: y,
      z: z,
      total: total
    };

    // 更新數字
    document.getElementById("xValue").textContent =
      x.toFixed(2);

    document.getElementById("yValue").textContent =
      y.toFixed(2);

    document.getElementById("zValue").textContent =
      z.toFixed(2);

    document.getElementById("totalValue").textContent =
      total.toFixed(2);

    document.getElementById("currentLevel").textContent =
      total.toFixed(2) + " m/s²";

    // 更新最大值
    if (total > peak) {
      peak = total;

      document.getElementById("peakValue").textContent =
        peak.toFixed(2) + " m/s²";
    }

    // 更新圖表
    updateChart(x, y, z);

    // 檢查警報
    checkAlarm(total);
  }

  // =========================
  // 6. 開始監測
  // =========================

  async function startSensor() {
    if (sensorRunning) return;

    try {
      if (typeof DeviceMotionEvent === "undefined") {
        alert("此瀏覽器不支援動作感測器");
        return;
      }

      // iPhone Safari 權限
      if (
        typeof DeviceMotionEvent.requestPermission === "function"
      ) {
        const permission =
          await DeviceMotionEvent.requestPermission();

        if (permission !== "granted") {
          alert("未取得動作感測器權限");
          return;
        }
      }

      window.addEventListener(
        "devicemotion",
        handleMotion
      );

      sensorRunning = true;

      document.getElementById("sensorStatus").textContent =
        "地震儀監測中";

      // 每 100ms 發布一次資料
      publishTimer = setInterval(() => {

        if (client && client.connected) {

          const data = {
            ...latestData,

            alarm:
              latestData.total > ALARM_THRESHOLD,

            threshold: ALARM_THRESHOLD,

            deviceId: deviceId,

            timestamp: Date.now()
          };

          client.publish(
            topic,
            JSON.stringify(data)
          );

          sentCount++;

          document.getElementById("sentCount").textContent =
            sentCount;
        }

      }, 100);

    } catch (error) {
      console.error(error);

      alert(
        "感測器啟動失敗：" + error.message
      );
    }
  }

  // =========================
  // 7. 停止監測
  // =========================

  function stopSensor() {
    if (!sensorRunning) return;

    window.removeEventListener(
      "devicemotion",
      handleMotion
    );

    clearInterval(publishTimer);
    publishTimer = null;

    sensorRunning = false;

    checkAlarm(0);

    document.getElementById("sensorStatus").textContent =
      "監測已停止";
  }

  // =========================
  // 8. 最大值歸零
  // =========================

  function resetPeak() {
    peak = 0;

    document.getElementById("peakValue").textContent =
      "0.00 m/s²";
  }
</script>

</body>
</html>
