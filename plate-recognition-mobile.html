<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手機車牌辨識（MQTT）</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--fg:#1c2230;--card:#fff;--bd:#d6dbe3;--ac:#1a7f4b;--mut:#64708a;--code:#eef1f5}
@media(prefers-color-scheme:dark){:root{--bg:#13161c;--fg:#e7eaf0;--card:#1c2129;--bd:#343b48;--ac:#4cc88a;--mut:#9aa5b8;--code:#12151a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Noto Sans TC",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font-size:14px;margin:0 0 8px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--bd)}
input,select{background:var(--code);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit;max-width:100%}
.dot{width:10px;height:10px;border-radius:50%;background:#e5484d;display:inline-block}.dot.on{background:#22c55e}
canvas,video{width:100%;border-radius:8px;background:#222;display:block}
.big{font:700 30px/1.2 ui-monospace,Menlo,monospace;letter-spacing:2px}
pre{background:var(--code);border-radius:8px;padding:8px;margin:0;max-height:200px;overflow:auto;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap}
small{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>手機車牌辨識 → MQTT</h1>

<div class="card"><h2>① MQTT 連線</h2>
  <div><span class="dot" id="dot"></span> <span id="mst">連線中…</span></div>
  <div class="row">裝置 ID <input id="dev" size="12"></div>
  <div class="row">Topic <input id="topic" size="34" value="nutc/im/s1411331044/plate/recognition"></div>
  <div class="row">同車牌重複發布間隔 <input id="gap" type="number" min="5" value="60" style="width:70px"> 秒</div>
  <small>離開鏡頭超過 3 秒再出現會立刻發布；持續停留則依間隔才再發布。</small>
</div>

<div class="card"><h2>② 辨識來源</h2>
  <div class="row">
    <select id="mode"><option value="sim">模擬模式（不需模型與相機）</option><option value="cam">真實相機（需接上模型）</option></select>
    <button id="go">開始</button><button class="alt" id="stop">停止</button>
  </div>
  <video id="vid" playsinline muted style="display:none"></video>
  <canvas id="cv" width="640" height="360"></canvas>
</div>

<div class="card"><h2>③ 目前結果</h2>
  <div class="big" id="cur">—</div>
  <small id="curInfo"></small>
  <h2 style="margin-top:10px">發布紀錄</h2><pre id="log"></pre>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
const W = 640, H = 360;

/* ---------- 裝置 ID ---------- */
$("dev").value = localStorage.plateDev || (localStorage.plateDev = "phone-" + Math.random().toString(36).slice(2, 7));
$("dev").onchange = () => localStorage.plateDev = $("dev").value.trim() || "phone";

function log(m) { const el = $("log"); el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; }

/* ---------- MQTT ---------- */
const client = mqtt.connect(BROKER, {
  clientId: "plate_" + Math.random().toString(16).slice(2, 10),
  reconnectPeriod: 3000, connectTimeout: 8000
});
const setSt = (on, t) => { $("dot").className = "dot" + (on ? " on" : ""); $("mst").textContent = t || (on ? "已連線 broker.hivemq.com" : "未連線"); };
client.on("connect", () => setSt(true));
client.on("reconnect", () => setSt(false, "重連中…"));
client.on("close", () => setSt(false));
client.on("error", e => setSt(false, "錯誤：" + e.message));

/* ---------- 台灣車牌校正（版型 regex + 依位置替換） ---------- */
const LET = "ABCDEFGHJKLMNPQRSTUVWXYZ", DIG = "0123456789";   // 假設不使用 I、O，請依監理規定確認
const FORMATS = [
  {name: "新式汽車", layout: "LLLDDDD", dash: 3, re: /^[A-HJ-NP-Z]{3}-\d{4}$/},
  {name: "舊式1234-AB", layout: "DDDDLL", dash: 4, re: /^\d{4}-[A-HJ-NP-Z]{2}$/},
  {name: "舊式AB-1234", layout: "LLDDDD", dash: 2, re: /^[A-HJ-NP-Z]{2}-\d{4}$/},
  {name: "機車", layout: "LLLDDD", dash: 3, re: /^[A-HJ-NP-Z]{3}-\d{3}$/},
];
const TO_D = {O:"0",D:"0",Q:"0",I:"1",L:"1",Z:"2",S:"5",G:"6",B:"8",T:"7"};
const TO_L = {"0":"D","1":"L","2":"Z","5":"S","6":"G","8":"B",O:"D",I:"L"};
function fixPlate(raw) {
  const s = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, ""), c = [];
  for (const f of FORMATS) {
    if (f.layout.length !== s.length) continue;
    let out = "", cost = 0, ok = true;
    for (let i = 0; i < s.length && ok; i++) {
      const ch = s[i], isD = f.layout[i] === "D", set = isD ? DIG : LET, map = isD ? TO_D : TO_L;
      if (set.includes(ch)) out += ch; else if (map[ch]) { out += map[ch]; cost++; } else ok = false;
    }
    if (!ok) continue;
    const text = out.slice(0, f.dash) + "-" + out.slice(f.dash);
    if (f.re.test(text)) c.push({text, format: f.name, cost});
  }
  c.sort((a, b) => a.cost - b.cost);
  return c[0] || null;
}

/* ---------- 偵測挑選：信心 → 排除邊緣 → 最大面積 ---------- */
function pickLargest(dets, thr = .5, m = 6) {
  let best = null, ba = 0;
  for (const d of dets) {
    if (d.conf < thr || d.x < m || d.y < m || d.x + d.w > W - m || d.y + d.h > H - m) continue;
    if (d.w * d.h > ba) { ba = d.w * d.h; best = d; }
  }
  return best;
}

/* ---------- 模型接入點：真實相機模式請在此實作 ---------- */
window.plateHooks = {
  // 回傳 [{x,y,w,h,conf}]（座標為 640x360 畫面）
  detect: async frameCanvas => [],
  // 回傳 {raw:"ABC1234", conf:0.9}
  ocr: async cropCanvas => ({raw: "", conf: 0}),
};

/* ---------- 模擬來源：每 ~12 秒換車，期間偶爾離開鏡頭 ---------- */
const pool = ["ABC-1234", "KLM-5678", "1234-AB", "XYZ-9087"];
const CONFUSE = {"0":"O","1":"I","8":"B","5":"S","2":"Z","6":"G","B":"8","D":"0","S":"5"};
let simCar = null, simUntil = 0;
function simDetect() {
  const now = Date.now();
  if (now > simUntil) {
    simCar = Math.random() < .25 ? null : pool[Math.floor(Math.random() * pool.length)];
    simUntil = now + 8000 + Math.random() * 6000;
  }
  const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#5a6578"); g.addColorStop(1, "#2b2f38");
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  if (!simCar) return [];
  const w = 300, h = 143, x = 170, y = 110;
  cx.fillStyle = "#f7f7f2"; cx.fillRect(x, y, w, h);
  cx.fillStyle = "#17653c"; cx.font = "700 88px ui-monospace,monospace"; cx.textAlign = "center"; cx.textBaseline = "middle";
  cx.fillText(simCar, x + w / 2, y + h / 2);
  return [{x, y, w, h, conf: .9, truth: simCar}];
}
function simOcr(t, noise = .25) {
  return t.replace("-", "").split("").map(c => Math.random() < noise ? (CONFUSE[c] || c) : c).join("");
}

/* ---------- 主迴圈：偵測 → 挑最大 → OCR → 校正 → 視窗投票 → 去重發布 ---------- */
const cv = $("cv"), cx = cv.getContext("2d"), vid = $("vid");
const frameCv = document.createElement("canvas"); frameCv.width = W; frameCv.height = H;
const cropCv = document.createElement("canvas"); cropCv.width = 192; cropCv.height = 96;
let timer = null, stream = null, win = [], seen = new Map(), warned = false;

async function tick() {
  const mode = $("mode").value;
  let dets;
  if (mode === "sim") dets = simDetect();
  else {
    cx.drawImage(vid, 0, 0, W, H);
    frameCv.getContext("2d").drawImage(vid, 0, 0, W, H);
    dets = await window.plateHooks.detect(frameCv);
    if (!dets.length && !warned) { warned = true; log("提示：plateHooks.detect 尚未接上模型，目前沒有偵測結果"); }
  }
  const best = pickLargest(dets);
  dets.forEach(d => { cx.strokeStyle = d === best ? "#22c55e" : "#facc15"; cx.lineWidth = 3; cx.strokeRect(d.x, d.y, d.w, d.h); });
  let fixed = null, conf = 0;
  if (best) {
    cropCv.getContext("2d").drawImage(mode === "sim" ? cv : frameCv, best.x, best.y, best.w, best.h, 0, 0, 192, 96);
    const o = mode === "sim" ? {raw: simOcr(best.truth), conf: .6 + Math.random() * .4} : await window.plateHooks.ocr(cropCv);
    fixed = fixPlate(o.raw); conf = o.conf;
    $("curInfo").textContent = "原始 OCR：" + o.raw;
  }
  win.push(fixed ? {t: fixed.text, f: fixed.format, c: conf} : null);
  if (win.length > 6) win.shift();
  stable();
}

function stable() {
  const cnt = {};
  win.forEach(r => { if (r) cnt[r.t] = (cnt[r.t] || 0) + 1; });
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  if (!top || cnt[top] < 3) { if (!win.some(Boolean)) $("cur").textContent = "—"; return; }
  const rs = win.filter(r => r && r.t === top);
  const conf = rs.reduce((s, r) => s + r.c, 0) / rs.length;
  $("cur").textContent = top;
  publishDedup(top, rs[0].f, conf);
}

function publishDedup(plate, format, conf) {
  const now = Date.now(), rec = seen.get(plate);
  const away = !rec || now - rec.lastSeen > 3000;
  const due = rec && now - rec.lastPub >= (+$("gap").value || 60) * 1000;
  if (rec) rec.lastSeen = now;
  if (!(away || due)) return;
  seen.set(plate, {lastSeen: now, lastPub: now});
  const d = new Date(now), p = n => String(n).padStart(2, "0");
  const payload = {
    device_id: $("dev").value.trim(), plate, format, confidence: +conf.toFixed(3),
    time: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`,
    timestamp: d.toISOString(),
  };
  if (!client.connected) { log("未連線，略過：" + plate); return; }
  client.publish($("topic").value.trim(), JSON.stringify(payload), {qos: 0});
  log(`已發布 ${plate}（${payload.time}）`);
}

$("go").onclick = async () => {
  $("stop").click(); win = []; seen.clear(); warned = false;
  if ($("mode").value === "cam") {
    try {
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment", width: {ideal: 1280}}, audio: false});
      vid.srcObject = stream; await vid.play();
    } catch (e) { log("相機啟動失敗：" + e.message + "（需 HTTPS 與相機權限）"); return; }
  }
  timer = setInterval(tick, 300);
};
$("stop").onclick = () => {
  clearInterval(timer); timer = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
};
</script>
</body>
</html>
