
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC 三軸加速度監測系統</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #edf2f7;
    text-align: center;
    padding: 30px;
}
.container {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 3px 15px #ccc;
}
h1 { color: #2563eb; }
.status {
    font-size: 20px;
    margin: 20px;
    color: #d97706;
}
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}
.data {
    background: #eaf2ff;
    padding: 25px 10px;
    border-radius: 15px;
}
.data h3 {
    margin: 5px;
    color: #334155;
}
.value {
    font-size: 32px;
    font-weight: bold;
    color: #2563eb;
}
.total {
    background: #dcfce7;
    grid-column: span 2;
}
.total .value {
    color: #15803d;
}
.info {
    margin-top: 25px;
    color: #64748b;
}
@media(max-width:500px) {
    .grid { grid-template-columns: 1fr; }
    .total { grid-column: span 1; }
}
</style>
</head>

<body>

<div class="container">

<h1>PC 三軸加速度監測系統</h1>

<div class="status" id="status">
MQTT 連線中...
</div>

<div class="grid">

<div class="data">
<h3>X 軸加速度</h3>
<div class="value" id="x">0.00</div>
m/s²
</div>

<div class="data">
<h3>Y 軸加速度</h3>
<div class="value" id="y">0.00</div>
m/s²
</div>

<div class="data">
<h3>Z 軸加速度</h3>
<div class="value" id="z">0.00</div>
m/s²
</div>

<div class="data total">
<h3>合成加速度</h3>
<div class="value" id="total">0.00</div>
m/s²
</div>

</div>

<div class="info">
<p>MQTT Topic：</p>
<p id="topic"></p>
<p>最後接收時間：<span id="time">尚未接收</span></p>
<p>接收封包數：<span id="count">0</span></p>
</div>

</div>

<script>

// MQTT 設定
const broker = "wss://broker.hivemq.com:8884/mqtt";

const topic = "nutc/im/s1411331044/accelerometer/data";

document.getElementById("topic").innerText = topic;

// 建立 MQTT 連線
const client = mqtt.connect(broker, {
    clientId: "pc_accel_" +
        Math.random().toString(16).substring(2, 10),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
});

let count = 0;

// MQTT 連線成功
client.on("connect", function() {

    document.getElementById("status").innerText =
        "MQTT 已連線，等待手機資料...";

    client.subscribe(topic, function(error) {

        if (error) {
            document.getElementById("status").innerText =
                "訂閱失敗";
        } else {
            document.getElementById("status").innerText =
                "已訂閱，等待手機傳送資料";
        }

    });

});

// 接收 MQTT 資料
client.on("message", function(receivedTopic, message) {

    if (receivedTopic !== topic) return;

    try {

        const data = JSON.parse(message.toString());

        const x = Number(data.x);
        const y = Number(data.y);
        const z = Number(data.z);

        if (![x, y, z].every(Number.isFinite)) return;

        // 計算合成加速度
        const total = Math.sqrt(
            x*x + y*y + z*z
        );

        document.getElementById("x").innerText =
            x.toFixed(2);

        document.getElementById("y").innerText =
            y.toFixed(2);

        document.getElementById("z").innerText =
            z.toFixed(2);

        document.getElementById("total").innerText =
            total.toFixed(2);

        // 更新時間
        document.getElementById("time").innerText =
            new Date().toLocaleTimeString();

        count++;

        document.getElementById("count").innerText =
            count;

        document.getElementById("status").innerText =
            "正在接收手機加速度資料";

    } catch(error) {

        console.error("資料解析錯誤：", error);

    }

});

// MQTT 事件
client.on("reconnect", function() {
    document.getElementById("status").innerText =
        "MQTT 重新連線中...";
});

client.on("error", function(error) {
    document.getElementById("status").innerText =
        "MQTT 錯誤：" + error.message;
});

client.on("close", function() {
    document.getElementById("status").innerText =
        "MQTT 已斷線";
});

</script>

</body>
</html>
