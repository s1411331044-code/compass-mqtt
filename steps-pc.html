
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC 走路步數監測系統</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #edf2f7;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 3px 15px #ccc;
}
h1 { color: #2563eb; }

.status {
  color: #d97706;
  font-size: 18px;
}

.stepsBox {
  background: #eaf2ff;
  padding: 30px;
  border-radius: 18px;
  margin: 25px 0;
}

.stepsBox strong {
  display: block;
  font-size: 85px;
  color: #2563eb;
}

.info {
  background: #f1f5f9;
  padding: 15px;
  margin: 12px 0;
  border-radius: 10px;
  text-align: left;
  word-break: break-all;
}

.label {
  color: #64748b;
  font-size: 14px;
}

.value {
  font-size: 19px;
  font-weight: bold;
  color: #334155;
}

#event {
  color: #15803d;
}
</style>
</head>

<body>

<div class="container">

<h1>PC 走路步數監測系統</h1>

<p class="status" id="status">MQTT 連線中...</p>

<div class="stepsBox">
  <h3>目前累計步數</h3>
  <strong id="steps">0</strong>
  STEPS
</div>

<div class="info">
  <div class="label">裝置 ID</div>
  <div class="value" id="deviceId">等待資料</div>
</div>

<div class="info">
  <div class="label">事件類型</div>
  <div class="value" id="event">等待資料</div>
</div>

<div class="info">
  <div class="label">最後接收時間</div>
  <div class="value" id="time">尚未接收</div>
</div>

<div class="info">
  <div class="label">訊息接收次數</div>
  <div class="value" id="count">0</div>
</div>

<div class="info">
  <div class="label">MQTT Topic</div>
  <div class="value">
    nutc/im/1411331044/steps
  </div>
</div>

</div>

<script>

// ===========================
// MQTT 設定
// ===========================

const broker = "wss://broker.hivemq.com:8884/mqtt";

const topic = "nutc/im/1411331044/steps";

const client = mqtt.connect(broker, {
  clientId: "steps_pc_" +
    Math.random().toString(16).slice(2, 10),
  clean: true,
  connectTimeout: 10000,
  reconnectPeriod: 3000
});

let count = 0;

// ===========================
// MQTT 連線
// ===========================

client.on("connect", () => {

  document.getElementById("status").innerText =
    "MQTT 已連線，正在訂閱步數資料";

  client.subscribe(topic, (error) => {

    if (error) {

      document.getElementById("status").innerText =
        "Topic 訂閱失敗";

    } else {

      document.getElementById("status").innerText =
        "已訂閱，等待手機步數資料";

    }

  });

});

client.on("reconnect", () => {
  document.getElementById("status").innerText =
    "MQTT 重新連線中...";
});

client.on("close", () => {
  document.getElementById("status").innerText =
    "MQTT 已斷線";
});

client.on("error", (error) => {
  document.getElementById("status").innerText =
    "MQTT 錯誤：" + error.message;
});

// ===========================
// 接收手機步數資料
// ===========================

client.on("message", (receivedTopic, message) => {

  if (receivedTopic !== topic) return;

  try {

    const data = JSON.parse(message.toString());

    // 檢查資料
    if (
      !Number.isInteger(data.steps) ||
      data.steps < 0 ||
      typeof data.deviceId !== "string" ||
      typeof data.timestamp !== "number" ||
      typeof data.eventType !== "string"
    ) {
      return;
    }

    // 更新累計步數
    document.getElementById("steps").innerText =
      data.steps;

    // 更新裝置 ID
    document.getElementById("deviceId").innerText =
      data.deviceId;

    // 更新事件類型
    document.getElementById("event").innerText =
      data.eventType;

    // 更新時間
    document.getElementById("time").innerText =
      new Date(data.timestamp).toLocaleString();

    // 接收次數
    count++;

    document.getElementById("count").innerText =
      count;

    document.getElementById("status").innerText =
      "正在接收手機步數資料";

  } catch (error) {

    console.error("JSON 解析錯誤", error);

  }

});

</script>

</body>
</html>
