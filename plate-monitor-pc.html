<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>車牌辨識即時監控（PC）</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--fg:#1c2230;--card:#fff;--bd:#d6dbe3;--ac:#1a7f4b;--mut:#64708a;--code:#eef1f5}
@media(prefers-color-scheme:dark){:root{--bg:#13161c;--fg:#e7eaf0;--card:#1c2129;--bd:#343b48;--ac:#4cc88a;--mut:#9aa5b8;--code:#12151a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Noto Sans TC",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
.dot{width:10px;height:10px;border-radius:50%;background:#e5484d;display:inline-block}.dot.on{background:#22c55e}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr!important}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card b{display:block;font-size:24px}.card span{color:var(--mut);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
h2{font-size:14px;color:var(--mut);margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
li{padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}
li .p{font:700 16px ui-monospace,Menlo,monospace;color:var(--ac)}
li small{color:var(--mut)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--bd)}
input{background:var(--code);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit;width:280px;max-width:100%}
</style>
</head>
<body>
<main>
<header>
  <h1>車牌辨識即時監控</h1>
  <div><span class="dot" id="dot"></span> <span id="mst">連線中…</span></div>
</header>
<div class="card" style="margin-bottom:12px">Topic <input id="topic" value="nutc/im/s1411331044/plate/recognition">
  <button class="alt" id="resub">重新訂閱</button></div>
<div class="stats">
  <div class="card"><b id="sEv">0</b><span>事件總數</span></div>
  <div class="card"><b id="sPl">0</b><span>不同車牌數</span></div>
  <div class="card"><b id="sDv">0</b><span>裝置數</span></div>
  <div class="card"><b id="sLast" style="font-size:15px">—</b><span>最後事件時間</span></div>
</div>
<div class="two">
  <div class="card"><h2>車牌名單</h2><ul id="plist"></ul></div>
  <div class="card"><h2>即時紀錄（最多 200 筆）
    <button class="alt" id="csv">匯出 CSV</button> <button class="alt" id="clr">清除</button></h2><ul id="elog"></ul></div>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
const events = [], plates = new Map(), devices = new Set();

const client = mqtt.connect(BROKER, {clientId: "platemon_" + Math.random().toString(16).slice(2, 10), reconnectPeriod: 3000});
let curTopic = "";
const sub = () => {
  if (curTopic) client.unsubscribe(curTopic);
  curTopic = $("topic").value.trim();
  client.subscribe(curTopic);
};
const setSt = (on, t) => { $("dot").className = "dot" + (on ? " on" : ""); $("mst").textContent = t || (on ? "已連線" : "未連線"); };
client.on("connect", () => { setSt(true); sub(); });
client.on("reconnect", () => setSt(false, "重連中…"));
client.on("close", () => setSt(false));
$("resub").onclick = sub;

client.on("message", (t, m) => {
  let d; try { d = JSON.parse(m.toString()); } catch { return; }
  if (!d || typeof d.plate !== "string" || d.plate.length > 12) return;   // 基本驗證，避免偽造內容
  const ev = {
    plate: d.plate, format: String(d.format || ""), conf: Number(d.confidence) || 0,
    device: String(d.device_id || "?").slice(0, 30), time: String(d.time || new Date().toLocaleString()).slice(0, 25),
  };
  events.unshift(ev); if (events.length > 200) events.pop();
  devices.add(ev.device);
  const r = plates.get(ev.plate) || {count: 0};
  Object.assign(r, {last: ev.time, device: ev.device, conf: ev.conf, count: r.count + 1});
  plates.set(ev.plate, r);
  render(ev.time);
});

function li(main, sub) {
  const e = document.createElement("li"), p = document.createElement("span"), s = document.createElement("small");
  p.className = "p"; p.textContent = main; s.textContent = " " + sub;
  e.append(p, s); return e;
}
function render(last) {
  $("sEv").textContent = events.length; $("sPl").textContent = plates.size;
  $("sDv").textContent = devices.size; if (last) $("sLast").textContent = last;
  $("plist").replaceChildren(...[...plates].sort((a, b) => b[1].last.localeCompare(a[1].last))
    .map(([p, r]) => li(p, `最後 ${r.last}｜${r.device}｜信心 ${r.conf.toFixed(2)}｜${r.count} 次`)));
  $("elog").replaceChildren(...events.map(e => li(e.plate, `${e.time}｜${e.device}｜${e.format}｜信心 ${e.conf.toFixed(2)}`)));
}
$("clr").onclick = () => { events.length = 0; plates.clear(); devices.clear(); $("sLast").textContent = "—"; render(); };
$("csv").onclick = () => {
  const rows = [["時間", "車牌", "版型", "信心", "裝置"], ...events.map(e => [e.time, e.plate, e.format, e.conf, e.device])];
  const q = v => '"' + String(v).replace(/"/g, '""').replace(/^([=+\-@])/, "'$1") + '"';   // 避免 CSV 公式注入
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "plate-events.csv"; a.click();
};
</script>
</body>
</html>
