<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手機端｜直式水平儀 MQTT</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif; text-align: center;
      background: #f0f4f8; color: #172033; margin: 0; padding: 16px;
    }
    .panel {
      width: 100%; max-width: 480px; margin: 12px auto; padding: 22px 18px;
      background: #fff; border-radius: 18px; box-shadow: 0 4px 18px #0001;
    }
    .angle { font-size: 23px; font-weight: bold; margin: 12px; }
    .level-wrap { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 20px auto; }
    .bubble {
      width: 84px; height: 250px; border: 4px solid #64748b;
      border-radius: 44px; position: relative; overflow: hidden;
      background: linear-gradient(to bottom, transparent 49.5%, #cbd5e1 49.5%, #cbd5e1 50.5%, transparent 50.5%);
    }
    .bubble::before {
      content: ""; position: absolute; left: 0; right: 0; top: 50%;
      border-top: 1px dashed #94a3b8;
    }
    .dot {
      width: 24px; height: 24px; border-radius: 50%; background: #16a34a;
      position: absolute; left: calc(50% - 12px); top: calc(50% - 12px);
      transition: transform .12s;
    }
    .scale { height: 250px; display: flex; flex-direction: column; justify-content: space-between; color: #64748b; font-size: 12px; }
    button { font-size: 17px; padding: 12px 20px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer; }
    button:disabled { background: #94a3b8; }
    #status { font-weight: bold; }
    pre { text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; background: #f8fafc; padding: 12px; border-radius: 8px; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>手機端：直式水平儀</h1>
    <p>MQTT 狀態：<span id="status">連線中...</span></p>
    <p>Topic：<code>nutc/im/s1411331044/compass/yaw</code></p>

    <div class="level-wrap">
      <div class="scale"><span>+90°</span><span>+45°</span><span>0°</span><span>-45°</span><span>-90°</span></div>
      <div class="bubble" aria-label="直式水平儀"><div class="dot" id="dot"></div></div>
    </div>

    <div class="angle">Pitch：<span id="pitch">--</span>°</div>
    <div class="angle">Roll：<span id="roll">--</span>°</div>
    <div class="angle">Yaw：<span id="yaw">--</span>°</div>
    <p id="hint">請連線後啟動感測器</p>
    <button id="start">啟動手機感測器</button>
    <h3>即將發布的 JSON</h3>
    <pre id="raw">尚無資料</pre>
  </main>

<script>
(() => {
  const BROKER = "wss://broker.hivemq.com:8884/mqtt";
  const TOPIC = "nutc/im/s1411331044/compass/yaw";
  const statusEl = document.getElementById("status");
  const startBtn = document.getElementById("start");
  let connected = false;
  let sensorStarted = false;

  const client = mqtt.connect(BROKER, {
    clientId: "phone_level_" + Math.random().toString(16).slice(2, 12),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
  });

  client.on("connect", () => {
    connected = true;
    statusEl.textContent = "已連線";
    statusEl.style.color = "green";
  });
  client.on("reconnect", () => statusEl.textContent = "重新連線中...");
  client.on("close", () => {
    connected = false;
    statusEl.textContent = "未連線／重新連線中";
  });
  client.on("error", err => {
    console.error("MQTT error:", err);
    statusEl.textContent = "連線錯誤，請確認網路或 Broker";
  });

  function updateLevel(pitch) {
    const y = Math.max(-90, Math.min(90, pitch)) * (100 / 90);
    document.getElementById("dot").style.transform = `translateY(${y}px)`;
  }

  function onOrientation(event) {
    if (event.beta == null || event.gamma == null) {
      document.getElementById("hint").textContent = "無法取得感測器資料，請確認瀏覽器權限及裝置支援。";
      return;
    }
    const data = {
      pitch: Number(event.beta.toFixed(2)),
      roll: Number(event.gamma.toFixed(2)),
      yaw: event.alpha == null ? null : Number(event.alpha.toFixed(2)),
      timestamp: new Date().toISOString()
    };
    document.getElementById("pitch").textContent = data.pitch.toFixed(2);
    document.getElementById("roll").textContent = data.roll.toFixed(2);
    document.getElementById("yaw").textContent = data.yaw == null ? "--" : data.yaw.toFixed(2);
    updateLevel(data.pitch);
    document.getElementById("hint").textContent =
      connected ? "感測器運作中，資料持續發布至 MQTT" : "感測器運作中，等待 MQTT 連線";
    document.getElementById("raw").textContent = JSON.stringify(data, null, 2);

    if (connected) {
      client.publish(TOPIC, JSON.stringify(data), { qos: 0, retain: false }, err => {
        if (err) console.error("MQTT 發布失敗：", err);
      });
    }
  }

  startBtn.addEventListener("click", async () => {
    if (sensorStarted) return;
    try {
      if (typeof DeviceOrientationEvent === "undefined") {
        statusEl.textContent = "此裝置／瀏覽器不支援方向感測器";
        return;
      }
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== "granted") {
          statusEl.textContent = "感測器權限被拒絕";
          return;
        }
      }
      window.addEventListener("deviceorientation", onOrientation);
      sensorStarted = true;
      startBtn.disabled = true;
      startBtn.textContent = "感測器已啟動";
      document.getElementById("hint").textContent = "正在讀取手機方向...";
    } catch (err) {
      console.error(err);
      statusEl.textContent = "啟動失敗，請使用 HTTPS 網頁並允許感測器權限";
    }
  });
})();
</script>
</body>
</html>
