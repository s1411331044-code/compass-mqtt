
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手機三軸加速度監測</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    text-align: center;
    padding: 20px;
}
.container {
    max-width: 450px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 3px 12px #ccc;
}
h2 { color: #2563eb; }
.data {
    background: #eaf2ff;
    padding: 15px;
    margin: 12px 0;
    border-radius: 12px;
    font-size: 22px;
}
button {
    padding: 14px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    margin: 8px;
}
#status { color: #d97706; }
</style>
</head>

<body>

<div class="container">
<h2>手機三軸加速度監測</h2>

<p id="status">MQTT 尚未連線</p>

<div class="data">X 軸：<span id="x">0.00</span> m/s²</div>
<div class="data">Y 軸：<span id="y">0.00</span> m/s²</div>
<div class="data">Z 軸：<span id="z">0.00</span> m/s²</div>

<div class="data">
合成加速度：<br>
<strong id="total">0.00</strong> m/s²
</div>

<button onclick="startSensor()">啟動感測器</button>
<button onclick="stopSensor()">停止感測器</button>

<p id="sensorStatus">感測器尚未啟動</p>
</div>

<script>
// MQTT 設定
const broker = "wss://broker.hivemq.com:8884/mqtt";

const topic = "nutc/im/s1411331044/accelerometer/data";

// 連接 MQTT
const client = mqtt.connect(broker, {
    clientId: "mobile_accel_" +
        Math.random().toString(16).substring(2, 10),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
});

let sensorActive = false;
let latestData = null;
let publishTimer = null;

client.on("connect", function() {
    document.getElementById("status").innerText =
        "MQTT 已連線";
});

client.on("reconnect", function() {
    document.getElementById("status").innerText =
        "MQTT 重新連線中...";
});

client.on("error", function(error) {
    document.getElementById("status").innerText =
        "MQTT 連線錯誤：" + error.message;
});

client.on("close", function() {
    document.getElementById("status").innerText =
        "MQTT 已斷線";
});

// 讀取手機加速度
function handleMotion(event) {

    if (!sensorActive) return;

    const acc = event.accelerationIncludingGravity;

    if (!acc ||
        acc.x === null ||
        acc.y === null ||
        acc.z === null) {
        return;
    }

    const x = acc.x;
    const y = acc.y;
    const z = acc.z;

    const total = Math.sqrt(
        x*x + y*y + z*z
    );

    latestData = {
        x: Number(x.toFixed(3)),
        y: Number(y.toFixed(3)),
        z: Number(z.toFixed(3)),
        total: Number(total.toFixed(3)),
        timestamp: Date.now()
    };

    // 顯示資料
    document.getElementById("x").innerText =
        latestData.x.toFixed(2);

    document.getElementById("y").innerText =
        latestData.y.toFixed(2);

    document.getElementById("z").innerText =
        latestData.z.toFixed(2);

    document.getElementById("total").innerText =
        latestData.total.toFixed(2);
}

// 啟動感測器
async function startSensor() {

    if (sensorActive) return;

    try {
        // iPhone Safari 權限處理
        if (
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission ===
            "function"
        ) {
            const permission =
                await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {
                alert("請允許使用動作感測器！");
                return;
            }
        }

        window.addEventListener(
            "devicemotion",
            handleMotion
        );

        sensorActive = true;

        document.getElementById("sensorStatus").innerText =
            "感測器運作中";

        // 每100毫秒發布一次
        publishTimer = setInterval(function() {

            if (!latestData) return;

            if (client.connected) {
                client.publish(
                    topic,
                    JSON.stringify(latestData)
                );
            }

        }, 100);

    } catch (error) {
        alert("感測器啟動失敗：" + error.message);
    }
}

// 停止感測器
function stopSensor() {

    sensorActive = false;

    window.removeEventListener(
        "devicemotion",
        handleMotion
    );

    if (publishTimer) {
        clearInterval(publishTimer);
        publishTimer = null;
    }

    latestData = null;

    document.getElementById("sensorStatus").innerText =
        "感測器已停止";
}

</script>

</body>
</html>
