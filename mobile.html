
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加速度與計步監測系統</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 18px;
      text-align: center;
    }
    h2 { color: #243447; }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin: 14px auto;
      max-width: 650px;
      box-shadow: 0 2px 8px #0001;
    }
    .values {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .value {
      background: #edf3fa;
      border-radius: 8px;
      padding: 14px 5px;
    }
    .number {
      font-size: 25px;
      font-weight: bold;
      margin-top: 6px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      color: white;
      background: #2878d0;
    }
    button.stop { background: #d9534f; }
    button.reset { background: #666; }
    input[type="range"] { width: 85%; }
    #status { color: #555; }
    canvas { max-width: 100%; }
  </style>
</head>
<body>
  <h2>手機加速度與計步監測</h2>

  <div class="panel">
    <p id="mqttStatus">MQTT 連線中...</p>
    <p id="sensorStatus">感測器尚未啟動</p>
    <button onclick="startSensor()">開始監測</button>
    <button class="stop" onclick="stopSensor()">停止監測</button>
  </div>

  <div class="panel">
    <h3>即時加速度（m/s²）</h3>
    <div class="values">
      <div class="value">X 軸<div class="number" id="xValue">0.00</div></div>
      <div class="value">Y 軸<div class="number" id="yValue">0.00</div></div>
      <div class="value">Z 軸<div class="number" id="zValue">0.00</div></div>
      <div class="value">合成加速度<div class="number" id="totalValue">0.00</div></div>
    </div>
  </div>

  <div class="panel">
    <h3>加速度即時圖表</h3>
    <canvas id="accelChart"></canvas>
  </div>

  <div class="panel">
    <h3>計步器</h3>
    <div class="number" style="font-size:42px">
      <span id="stepsValue">0</span> 步
    </div>
    <p id="stepStatus">等待開始</p>
    <button class="reset" onclick="resetSteps()">步數歸零</button>
    <hr>
    <p>計步靈敏度：<span id="sensitivityValue">1.20</span></p>
    <input
      id="sensitivity"
      type="range"
      min="0.5"
      max="3"
      step="0.1"
      value="1.2"
      oninput="changeSensitivity(this.value)"
    >
    <p style="font-size:13px;color:#666">
      數值越小越敏感；數值越大越不容易計步。
    </p>
  </div>

<script>
  // MQTT 設定
  const broker = "wss://broker.hivemq.com:8884/mqtt";
  const accelTopic = "nutc/im/s1411331044/accelerometer/data";
  const stepsTopic = "nutc/im/1411331044/steps";

  const deviceId = localStorage.getItem("deviceId") ||
    ("phone-" + Math.random().toString(36).slice(2, 10));

  localStorage.setItem("deviceId", deviceId);

  let client = null;
  let sensorRunning = false;
  let publishTimer = null;
  let updateTimer = null;

  let latestData = { x: 0, y: 0, z: 0, total: 0 };
  let steps = 0;
  let sensitivity = 1.2;

  // 計步演算法資料
  let magnitudeHistory = [];
  let previousMagnitude = null;
  let peakCandidate = null;
  let lastStepTime = 0;
  const minStepInterval = 300;

  // MQTT 連線
  client = mqtt.connect(broker, {
    clientId: "mobile_" + Math.random().toString(16).slice(2, 10),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
  });

  client.on("connect", () => {
    document.getElementById("mqttStatus").textContent = "MQTT 已連線";
  });

  client.on("reconnect", () => {
    document.getElementById("mqttStatus").textContent = "MQTT 重新連線中...";
  });

  client.on("error", (err) => {
    console.error("MQTT 錯誤：", err);
    document.getElementById("mqttStatus").textContent = "MQTT 連線錯誤";
  });

  // 加速度圖表
  const ctx = document.getElementById("accelChart");

  const chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [
        {
          label: "X 軸",
          data: [],
          borderColor: "red",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        },
        {
          label: "Y 軸",
          data: [],
          borderColor: "green",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        },
        {
          label: "Z 軸",
          data: [],
          borderColor: "blue",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        },
        {
          label: "合成加速度",
          data: [],
          borderColor: "purple",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        }
      ]
    },
    options: {
      responsive: true,
      animation: false,
      scales: {
        x: { display: false },
        y: { title: { display: true, text: "m/s²" } }
      }
    }
  });

  function updateChart(x, y, z, total) {
    const time = new Date().toLocaleTimeString();

    chart.data.labels.push(time);
    chart.data.datasets[0].data.push(x);
    chart.data.datasets[1].data.push(y);
    chart.data.datasets[2].data.push(z);
    chart.data.datasets[3].data.push(total);

    if (chart.data.labels.length > 50) {
      chart.data.labels.shift();
      chart.data.datasets.forEach(dataset => dataset.data.shift());
    }

    chart.update("none");
  }

  // 感測器資料
  function handleMotion(event) {
    const a = event.accelerationIncludingGravity;

    if (!a) return;

    const x = a.x ?? 0;
    const y = a.y ?? 0;
    const z = a.z ?? 0;
    const total = Math.sqrt(x*x + y*y + z*z);

    latestData = { x, y, z, total };

    document.getElementById("xValue").textContent = x.toFixed(2);
    document.getElementById("yValue").textContent = y.toFixed(2);
    document.getElementById("zValue").textContent = z.toFixed(2);
    document.getElementById("totalValue").textContent = total.toFixed(2);

    updateChart(x, y, z, total);
    detectStep(total);
  }

  // 簡易計步：利用合成加速度的局部波峰判斷步伐
  function detectStep(magnitude) {
    magnitudeHistory.push(magnitude);

    if (magnitudeHistory.length > 20) {
      magnitudeHistory.shift();
    }

    if (magnitudeHistory.length < 10) {
      previousMagnitude = magnitude;
      return;
    }

    const baseline =
      magnitudeHistory.reduce((sum, value) => sum + value, 0) /
      magnitudeHistory.length;

    if (peakCandidate === null) {
      peakCandidate = magnitude;
    }

    if (magnitude > peakCandidate) {
      peakCandidate = magnitude;
    }

    // 波峰開始下降時，檢查波峰是否超過靈敏度門檻
    if (
      previousMagnitude !== null &&
      magnitude < previousMagnitude &&
      previousMagnitude >= peakCandidate
    ) {
      const now = Date.now();
      const difference = peakCandidate - baseline;

      if (
        difference >= sensitivity &&
        now - lastStepTime >= minStepInterval
      ) {
        steps++;
        lastStepTime = now;
        document.getElementById("stepsValue").textContent = steps;
        document.getElementById("stepStatus").textContent = "已偵測到一步";
        publishSteps("step");
      }

      peakCandidate = magnitude;
    }

    previousMagnitude = magnitude;
  }

  // 開始感測器
  async function startSensor() {
    if (sensorRunning) return;

    try {
      // iPhone Safari 需要使用者按鈕觸發權限請求
      if (
        typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function"
      ) {
        const permission = await DeviceMotionEvent.requestPermission();

        if (permission !== "granted") {
          alert("沒有取得動作感測器權限");
          return;
        }
      }

      window.addEventListener("devicemotion", handleMotion);
      sensorRunning = true;

      document.getElementById("sensorStatus").textContent =
        "感測器運作中";

      document.getElementById("stepStatus").textContent =
        "計步器運作中";

      // 每 100ms 發布加速度
      publishTimer = setInterval(() => {
        if (client && client.connected) {
          client.publish(accelTopic, JSON.stringify({
            ...latestData,
            deviceId,
            timestamp: Date.now()
          }));
        }
      }, 100);

      // 每 5 秒發布一次目前步數
      updateTimer = setInterval(() => {
        publishSteps("update");
      }, 5000);

    } catch (error) {
      console.error(error);
      alert("無法啟動感測器：" + error.message);
    }
  }

  // 停止感測器
  function stopSensor() {
    if (!sensorRunning) return;

    window.removeEventListener("devicemotion", handleMotion);

    clearInterval(publishTimer);
    clearInterval(updateTimer);

    sensorRunning = false;

    document.getElementById("sensorStatus").textContent =
      "感測器已停止";

    document.getElementById("stepStatus").textContent =
      "計步器已停止";
  }

  // 發布步數
  function publishSteps(eventType) {
    const data = {
      steps: steps,
      deviceId: deviceId,
      timestamp: Date.now(),
      eventType: eventType
    };

    if (client && client.connected) {
      client.publish(stepsTopic, JSON.stringify(data));
    }
  }

  // 步數歸零
  function resetSteps() {
    steps = 0;

    document.getElementById("stepsValue").textContent = 0;
    document.getElementById("stepStatus").textContent = "步數已歸零";

    magnitudeHistory = [];
    previousMagnitude = null;
    peakCandidate = null;
    lastStepTime = 0;

    publishSteps("reset");
  }

  // 調整靈敏度
  function changeSensitivity(value) {
    sensitivity = Number(value);
    document.getElementById("sensitivityValue").textContent =
      sensitivity.toFixed(2);
  }
</script>
</body>
</html>
