
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手機走路步數偵測</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  text-align: center;
  padding: 15px;
}
.container {
  max-width: 450px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 3px 12px #ccc;
}
h2 { color: #2563eb; }
.steps {
  background: #eaf2ff;
  border-radius: 15px;
  padding: 25px;
  margin: 20px 0;
}
.steps strong {
  display: block;
  font-size: 65px;
  color: #2563eb;
}
button {
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  margin: 6px;
  font-size: 16px;
  color: white;
  background: #2563eb;
}
.stop { background: #dc2626; }
.reset { background: #64748b; }
input { width: 85%; }
.status { margin: 15px; color: #d97706; }
.info { color: #64748b; font-size: 13px; }
</style>
</head>

<body>

<div class="container">

<h2>手機走路步數偵測</h2>

<p id="mqttStatus" class="status">MQTT 連線中...</p>
<p id="sensorStatus">感測器尚未啟動</p>

<div class="steps">
  <div>累計步數</div>
  <strong id="steps">0</strong>
  <div>STEPS</div>
</div>

<h3>計步靈敏度</h3>
<p>目前門檻：<span id="sensitivityValue">1.20</span> m/s²</p>

<input
  type="range"
  id="sensitivity"
  min="0.5"
  max="3.0"
  step="0.1"
  value="1.2"
  oninput="changeSensitivity(this.value)"
>

<p class="info">
數值越低越靈敏，數值越高越不容易計步
</p>

<button onclick="startStep()">開始計步</button>
<button class="stop" onclick="stopStep()">停止</button>
<button class="reset" onclick="resetSteps()">歸零</button>

<hr>

<p>裝置 ID：<span id="deviceId"></span></p>
<p>最後發布：<span id="lastPublish">尚未發布</span></p>
<p>發布次數：<span id="publishCount">0</span></p>

</div>

<script>

// ===========================
// MQTT 設定
// ===========================

const broker = "wss://broker.hivemq.com:8884/mqtt";

const topic = "nutc/im/1411331044/steps";

const deviceId = localStorage.getItem("stepDeviceId") ||
  ("phone_" + Math.random().toString(16).slice(2, 10));

localStorage.setItem("stepDeviceId", deviceId);

document.getElementById("deviceId").innerText = deviceId;

const client = mqtt.connect(broker, {
  clientId: "steps_mobile_" +
    Math.random().toString(16).slice(2, 10),
  clean: true,
  connectTimeout: 10000,
  reconnectPeriod: 3000
});

let steps = 0;
let running = false;
let publishTimer = null;
let publishCount = 0;

// ===========================
// MQTT 連線
// ===========================

client.on("connect", () => {
  document.getElementById("mqttStatus").innerText =
    "MQTT 已連線";
});

client.on("reconnect", () => {
  document.getElementById("mqttStatus").innerText =
    "MQTT 重新連線中...";
});

client.on("close", () => {
  document.getElementById("mqttStatus").innerText =
    "MQTT 已斷線";
});

client.on("error", (err) => {
  document.getElementById("mqttStatus").innerText =
    "MQTT 錯誤：" + err.message;
});

// ===========================
// JSON 發布函數
// ===========================

function publishData(eventType) {

  const data = {
    steps: steps,
    deviceId: deviceId,
    timestamp: Date.now(),
    eventType: eventType
  };

  if (client.connected) {

    client.publish(
      topic,
      JSON.stringify(data),
      { qos: 0 },
      (error) => {
        if (!error) {
          publishCount++;

          document.getElementById("publishCount").innerText =
            publishCount;

          document.getElementById("lastPublish").innerText =
            new Date().toLocaleTimeString();
        }
      }
    );

  }
}

// ===========================
// 計步變數
// ===========================

let sensitivity = 1.2;

let magnitudeHistory = [];
let previousDeviation = 0;
let previousPreviousDeviation = 0;

let lastStepTime = 0;

const STEP_INTERVAL = 300;

// ===========================
// 調整靈敏度
// ===========================

function changeSensitivity(value) {

  sensitivity = Number(value);

  document.getElementById("sensitivityValue").innerText =
    sensitivity.toFixed(2);

}

// ===========================
// 加速度偵測
// ===========================

function detectStep(event) {

  if (!running) return;

  const acc = event.accelerationIncludingGravity;

  if (!acc ||
      acc.x === null ||
      acc.y === null ||
      acc.z === null) return;

  const x = acc.x;
  const y = acc.y;
  const z = acc.z;

  // 計算合成加速度
  const magnitude = Math.sqrt(
    x*x + y*y + z*z
  );

  // 使用最近一段時間的平均值估計重力基線
  magnitudeHistory.push(magnitude);

  if (magnitudeHistory.length > 20) {
    magnitudeHistory.shift();
  }

  if (magnitudeHistory.length < 10) return;

  const average = magnitudeHistory.reduce(
    (a, b) => a + b, 0
  ) / magnitudeHistory.length;

  // 取得動態加速度變化
  const deviation = magnitude - average;

  // 偵測局部波峰
  const isPeak =
    previousDeviation > previousPreviousDeviation &&
    previousDeviation > deviation;

  const now = Date.now();

  if (
    isPeak &&
    previousDeviation > sensitivity &&
    now - lastStepTime > STEP_INTERVAL
  ) {

    steps++;

    lastStepTime = now;

    document.getElementById("steps").innerText = steps;

    // 每增加一步立即發布
    publishData("step");
  }

  previousPreviousDeviation = previousDeviation;
  previousDeviation = deviation;

}

// ===========================
// 開始計步
// ===========================

async function startStep() {

  if (running) return;

  try {

    // iPhone Safari 權限
    if (
      typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function"
    ) {

      const permission =
        await DeviceMotionEvent.requestPermission();

      if (permission !== "granted") {
        alert("請允許使用動作感測器！");
        return;
      }

    }

    if (typeof DeviceMotionEvent === "undefined") {
      alert("此瀏覽器不支援動作感測器");
      return;
    }

    magnitudeHistory = [];
    previousDeviation = 0;
    previousPreviousDeviation = 0;
    lastStepTime = Date.now();

    window.addEventListener(
      "devicemotion",
      detectStep
    );

    running = true;

    document.getElementById("sensorStatus").innerText =
      "正在偵測走路步數";

    // 每5秒發布目前步數
    publishTimer = setInterval(() => {
      publishData("update");
    }, 5000);

    // 開始時先發布目前狀態
    publishData("update");

  } catch (error) {

    alert("啟動失敗：" + error.message);

  }

}

// ===========================
// 停止計步
// ===========================

function stopStep() {

  running = false;

  window.removeEventListener(
    "devicemotion",
    detectStep
  );

  if (publishTimer) {
    clearInterval(publishTimer);
    publishTimer = null;
  }

  document.getElementById("sensorStatus").innerText =
    "計步已停止";

}

// ===========================
// 歸零
// ===========================

function resetSteps() {

  steps = 0;

  document.getElementById("steps").innerText = 0;

  magnitudeHistory = [];
  previousDeviation = 0;
  previousPreviousDeviation = 0;
  lastStepTime = Date.now();

  // 發布歸零事件
  publishData("reset");

}

</script>

</body>
</html>
